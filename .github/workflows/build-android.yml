name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "mobile/**"
      - ".github/workflows/build-android.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mobile/package.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare web assets
        working-directory: mobile
        run: |
          mkdir -p www
          cp index.html style.css app.js manifest.webmanifest www/

      - name: Install Capacitor
        working-directory: mobile
        run: npm install

      - name: Generate Android project
        working-directory: mobile
        run: npx cap add android

      - name: Add camera permission
        working-directory: mobile
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text(encoding="utf-8")
          marker = '<uses-permission android:name="android.permission.CAMERA" />'
          if marker not in s:
              s = s.replace("<application", marker + "\n    <application", 1)
          p.write_text(s, encoding="utf-8")
          PY

      - name: Build debug APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SignBridge-Android-APK
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
