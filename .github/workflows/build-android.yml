name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/build-android.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install Android SDK components
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -n 1)"
          fi
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Prepare web assets
        working-directory: mobile
        run: |
          mkdir -p www
          cp index.html style.css app.js manifest.webmanifest www/

      - name: Install Capacitor dependencies
        working-directory: mobile
        run: npm install --no-audit --no-fund

      - name: Generate Android project
        working-directory: mobile
        run: npx cap add android

      - name: Configure Android camera permissions
        working-directory: mobile
        run: |
          python - <<'PY'
          from pathlib import Path
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text(encoding="utf-8")
          camera_permission = '<uses-permission android:name="android.permission.CAMERA" />'
          camera_feature = '<uses-feature android:name="android.hardware.camera.any" android:required="false" />'
          if camera_permission not in text:
              text = text.replace("<application", camera_permission + "\n    <application", 1)
          if camera_feature not in text:
              text = text.replace("<application", camera_feature + "\n    <application", 1)
          manifest.write_text(text, encoding="utf-8")

          # Request Android's runtime permission before the WebView opens the camera.
          activity = Path("android/app/src/main/java/com/signbridge/app/MainActivity.java")
          activity.parent.mkdir(parents=True, exist_ok=True)
          activity.write_text("""package com.signbridge.app;

          import android.Manifest;
          import android.content.pm.PackageManager;
          import android.os.Bundle;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  if (ContextCompat.checkSelfPermission(this, Manifest.permission.CAMERA)
                          != PackageManager.PERMISSION_GRANTED) {
                      ActivityCompat.requestPermissions(
                              this, new String[]{Manifest.permission.CAMERA}, 1001);
                  }
              }
          }
          """, encoding="utf-8")
          PY

      - name: Build debug APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SignBridge-Android-APK
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
