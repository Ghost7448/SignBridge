name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "simple_signs_app.py"
      - "requirements-demo.txt"
      - "installer/**"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-demo.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-demo.txt
          python -m pip install pyinstaller

      - name: Package application
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --name SignBridge --collect-all mediapipe --collect-all cv2 --collect-all google.protobuf --hidden-import=mediapipe.python.solutions.hands --hidden-import=PIL._tkinter_finder simple_signs_app.py

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw "Chocolatey failed to install Inno Setup (exit $LASTEXITCODE)." }

      - name: Locate Inno Setup compiler
        id: inno
        shell: pwsh
        run: |
          $candidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles}\Inno Setup 6\ISCC.exe",
            "$env:ChocolateyInstall\lib\innosetup\tools\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
          if (-not $iscc) {
            $found = Get-ChildItem "$env:ProgramFiles", "${env:ProgramFiles(x86)}", "$env:ChocolateyInstall\lib" -Filter ISCC.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($found) { $iscc = $found.FullName }
          }
          if (-not $iscc) { throw "ISCC.exe not found after Inno Setup installation." }
          "path=$iscc" >> $env:GITHUB_OUTPUT
          Write-Host "Using Inno Setup compiler: $iscc"

      - name: Build installer
        shell: pwsh
        run: |
          & "${{ steps.inno.outputs.path }}" "installer\SignBridge.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path "installer\output\SignBridge-Setup.exe")) { throw "Installer output was not created." }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: SignBridge-Windows-Installer
          path: installer/output/SignBridge-Setup.exe
          if-no-files-found: error
