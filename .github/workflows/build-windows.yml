name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-demo.txt
          pip install pyinstaller

      - name: Package application
        run: |
          pyinstaller --noconfirm --clean --windowed --name SignBridge --collect-all mediapipe --collect-all cv2 --collect-all google.protobuf --hidden-import=mediapipe.python.solutions.hands --hidden-import=PIL._tkinter_finder simple_signs_app.py

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "$env:ProgramFiles(x86)\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { throw "Inno Setup compiler not found at $iscc" }
          & $iscc "installer\SignBridge.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: SignBridge-Windows-Installer
          path: installer/output/SignBridge-Setup.exe
          if-no-files-found: error
