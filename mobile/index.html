<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1020">
  <meta name="description" content="SignBridge">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./style.css">
  <title>SignBridge</title>
</head>
<body>
  <main class="app">
    <header class="top">
      <div class="brand-mark" aria-hidden="true">S</div>
      <div><h1>SignBridge</h1><p>خلّي إيدك قدام الكاميرا</p></div>
    </header>
    <section class="camera-card">
      <div class="camera-wrap">
        <video id="camera" autoplay playsinline muted></video>
        <canvas id="landmarks" aria-hidden="true"></canvas>
        <div id="camera-placeholder" class="placeholder">اضغط تشغيل الكاميرا للبدء</div>
        <div id="loading" class="loading" hidden>جارٍ تحميل التعرّف...</div>
      </div>
      <div class="actions">
        <button id="start" class="primary">تشغيل الكاميرا</button>
        <button id="stop" class="secondary" disabled>إيقاف</button>
      </div>
    </section>
    <section class="result-card" aria-live="polite">
      <span class="eyebrow">النتيجة</span>
      <div id="result" class="result">جاهز</div>
      <p id="status" class="status">الكاميرا متوقفة</p>
    </section>
  </main>
  <script type="module" src="./app.js"></script>
</body>
</html>
